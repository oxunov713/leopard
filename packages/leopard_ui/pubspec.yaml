name: leopard_ui
description: Shared visual design of Leopard - colour tokens, Material 3 dark theme, bundled fonts and the icon set. Used by the Android and web apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # Bundled (never fetched at runtime: the web app has a strict CSP). Variable
  # fonts: every weight points at the same file and the engine picks the wght
  # axis value from the requested FontWeight. Licences: assets/fonts/OFL-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
