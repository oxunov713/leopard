name: leopard_core
description: >-
  Client-side core of the Leopard password manager: the cryptography in
  docs/crypto-spec.md, vault item models, a typed API client, password
  generation and password auditing. Pure Dart, no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cryptography: ^2.9.0
  http: ^1.2.0
  unorm_dart: ^0.3.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
