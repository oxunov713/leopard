name: web

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/leopard_core/**"
      - "docs/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/leopard_core/**"
      - "docs/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # On failure the reformatted sources are printed as a patch
      # (gzip + base64 between the markers), so a formatting slip can be
      # fixed without a local SDK:
      #   sed -n '/BEGIN FORMAT PATCH/,/END FORMAT PATCH/p' log | grep -v PATCH | base64 -d | gunzip | git apply
      - name: dart format
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test > /dev/null
            echo "-----BEGIN FORMAT PATCH-----"
            git diff -- lib test | gzip -9 | base64 -w 120
            echo "-----END FORMAT PATCH-----"
            exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # The same crypto as above, but in a real browser: Web Crypto for
      # AES-GCM / HKDF / X25519 and Argon2id compiled to JavaScript, checked
      # against values from docs/test-vectors.json.
      - run: flutter test --platform chrome test/browser
      # --no-web-resources-cdn: CanvasKit is served from this origin, not
      #   from www.gstatic.com.
      # --csp: no dynamically generated code in the compiled JavaScript.
      # LEOPARD_API_URL: set the repository variable to build a deployable
      #   artifact; the placeholder only proves that the build works.
      - run: >-
          flutter build web --release --no-web-resources-cdn --csp
          --dart-define=LEOPARD_API_URL=${{ vars.LEOPARD_API_URL || 'https://api.leopard.invalid' }}
      - name: TEMP inspect
        run: |
          ls -la build/web build/web/canvaskit || true
          head -c 600 build/web/flutter_service_worker.js || true
          echo; tail -c 1500 build/web/flutter_bootstrap.js; echo
          cat build/web/index.html
          grep -o 'new Function' build/web/canvaskit/canvaskit.js | wc -l
          grep -o 'new Function\|eval(' build/web/main.dart.js | sort | uniq -c
          grep -o 'https://[a-zA-Z0-9./_-]*' build/web/main.dart.js build/web/flutter_bootstrap.js | sort | uniq -c | sort -rn | head -40
          for o in O2 O4; do
            dart compile js -$o -o "$RUNNER_TEMP/bench_$o.js" tool/argon2_bench.dart
            (echo 'globalThis.self = globalThis;'; cat "$RUNNER_TEMP/bench_$o.js") > "$RUNNER_TEMP/b_$o.js"
            node --version; node "$RUNNER_TEMP/b_$o.js" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: leopard-web
          path: apps/web/build/web
          if-no-files-found: error
          retention-days: 7
