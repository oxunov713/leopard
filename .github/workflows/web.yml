name: web

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/leopard_core/**"
      - "docs/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/leopard_core/**"
      - "docs/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # On failure the reformatted sources are uploaded as a patch, so a
      # formatting slip can be fixed with `git apply` without a local SDK.
      - name: dart format
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test test_browser; then
            dart format lib test test_browser
            git diff -- lib test test_browser > "$RUNNER_TEMP/format.patch"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: ignore
          retention-days: 1
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # The same crypto as above, but in a real browser: Web Crypto for
      # AES-GCM / HKDF / X25519 and Argon2id compiled to JavaScript, checked
      # against values from docs/test-vectors.json.
      - run: flutter test --platform chrome test_browser
      # --no-web-resources-cdn: CanvasKit is served from this origin, not
      #   from www.gstatic.com.
      # --csp: no dynamically generated code in the compiled JavaScript.
      # LEOPARD_API_URL: set the repository variable to build a deployable
      #   artifact; the placeholder only proves that the build works.
      - run: >-
          flutter build web --release --no-web-resources-cdn --csp
          --dart-define=LEOPARD_API_URL=${{ vars.LEOPARD_API_URL || 'https://api.leopard.invalid' }}
      - name: The build is self-contained
        run: |
          test -f build/web/canvaskit/canvaskit.wasm
          test -f build/web/main.dart.js
          test ! -e build/web/flutter_service_worker.js
          # No inline script in the page: the CSP allows script-src 'self' only.
          ! grep -n '<script>' build/web/index.html
          ls -la build/web build/web/canvaskit
          tail -c 1200 build/web/flutter_bootstrap.js
      - uses: actions/upload-artifact@v4
        with:
          name: leopard-web
          path: apps/web/build/web
          if-no-files-found: error
          retention-days: 7
