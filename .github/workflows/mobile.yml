name: mobile

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/leopard_core/**"
      - "packages/leopard_ui/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/leopard_core/**"
      - "packages/leopard_ui/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: an unpinned stable broke --fatal-infos overnight
          # (3.50 deprecates package:flutter/material.dart). Bump on purpose.
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version
      - name: leopard_ui (format, analyze, test)
        working-directory: packages/leopard_ui
        run: |
          flutter pub get
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test > /dev/null
            echo "-----BEGIN FORMAT PATCH-----"
            git diff -- lib test | gzip -9 | base64 -w 120
            echo "-----END FORMAT PATCH-----"
            exit 1
          fi
          flutter analyze --fatal-infos
          flutter test
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # android/gradlew and gradle-wrapper.jar are not in the repository (the
      # Flutter template git-ignores them); the flutter tool adds its own
      # copies before it runs Gradle.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: leopard-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
