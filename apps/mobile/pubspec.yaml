name: leopard_mobile
description: Leopard for Android. The phone app of the Leopard zero-knowledge password manager.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  leopard_core:
    path: ../../packages/leopard_core

  bloc: ^9.0.0
  cryptography: ^2.9.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  http: ^1.2.0
  local_auth: ^3.0.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Pure-Dart tests import package:test directly. The version is whatever
  # flutter_test's pinned test_api allows.
  test: any

flutter:
  uses-material-design: true
