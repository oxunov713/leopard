name: leopard_web
description: Leopard for the browser. The web app of the Leopard zero-knowledge password manager.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  leopard_core:
    path: ../../packages/leopard_core

  bloc: ^9.0.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  go_router: ^17.5.0
  http: ^1.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  # Whatever flutter_test pins.
  fake_async: any
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Pure-Dart tests import package:test directly. The version is whatever
  # flutter_test's pinned test_api allows.
  test: any

flutter:
  uses-material-design: true

  # Bundled so that nothing is fetched from a font CDN at runtime: the site's
  # Content-Security-Policy allows connections to itself and the API only.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
